[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trader"
version = "0.1.0"
description = "Domain-Aware Trading Agent (D.A.T.A.) - A multi-agent, domain-aware trading system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "D.A.T.A. Team"}
]
keywords = ["trading", "algorithmic-trading", "multi-agent", "machine-learning", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # Core
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",

    # Data processing
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",

    # Time series & financial
    "ta>=0.10",  # Technical analysis
    "pandas-ta>=0.3",

    # Machine Learning
    "scikit-learn>=1.3",
    "torch>=2.0",
    "statsmodels>=0.14",

    # ML tracking
    "mlflow>=2.0",

    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "redis>=4.5",

    # Trading APIs
    "ccxt>=4.0",  # Crypto exchanges
    "alpaca-trade-api>=3.0",  # Equities

    # Messaging & async
    "celery>=5.3",

    # Logging & monitoring
    "loguru>=0.7",
    "structlog>=23.0",

    # HTTP & API
    "httpx>=0.24",
    "aiohttp>=3.8",

    # Backtesting & analytics
    "vectorbt>=0.26",
    "quantstats>=0.0.62",
    "empyrical>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/john-fizer/Agentic-Trader"
Repository = "https://github.com/john-fizer/Agentic-Trader"

[project.scripts]
data-agent = "src.orchestrator.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

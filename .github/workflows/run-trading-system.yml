name: Run Trading System

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration to run (in minutes)'
        required: false
        default: '5'
        type: number
      log_level:
        description: 'Log level'
        required: false
        default: 'INFO'
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR

jobs:
  run-data-system:
    name: Run D.A.T.A. Trading System
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Create logs directory
      run: mkdir -p logs

    - name: Verify configuration files
      run: |
        echo "Checking configuration files..."
        ls -la config/
        echo "Configuration files present:"
        ls config/

    - name: Run D.A.T.A. System (time-limited)
      env:
        # Broker API keys (add these as repository secrets)
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        # Database configuration (add as secrets if needed)
        TIMESCALE_HOST: ${{ secrets.TIMESCALE_HOST }}
        TIMESCALE_USER: ${{ secrets.TIMESCALE_USER }}
        TIMESCALE_PASSWORD: ${{ secrets.TIMESCALE_PASSWORD }}
        # Redis configuration
        REDIS_HOST: ${{ secrets.REDIS_HOST }}
        REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        # Log level
        LOG_LEVEL: ${{ inputs.log_level }}
      run: |
        echo "Starting D.A.T.A. Trading System for ${{ inputs.duration }} minutes..."
        # Run the system with timeout
        timeout ${{ inputs.duration }}m python -m src.orchestrator.main || true
        echo "Trading system run completed or timed out"

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trading-logs-${{ github.run_number }}
        path: logs/
        retention-days: 30

    - name: Display log summary
      if: always()
      run: |
        echo "=== Log Summary ==="
        if [ -d "logs" ] && [ "$(ls -A logs)" ]; then
          echo "Logs generated:"
          ls -lh logs/
          echo ""
          echo "Last 50 lines of latest log:"
          tail -n 50 logs/*.log | head -n 50 || echo "No logs found"
        else
          echo "No logs generated"
        fi
